<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08734f">
  <title>BNP - Espace personnel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
      color: #202b27;
    }
    header {
      background: #08734f;
      color: white;
      padding: 25px 20px;
    }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin-bottom: 0; }
    main { padding: 20px; max-width: 600px; margin: auto; }
    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000c;
    }
    .balance { background: #08734f; color: white; }
    .amount { font-size: 32px; font-weight: bold; margin-top: 12px; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 15px;
      background: #08734f;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }
    .notice { font-size: 12px; color: #59665f; }
    footer { text-align: center; padding: 20px; font-size: 12px; color: #64716b; }
  </style>
</head>
<body>
  <header>
    <h1>BNP</h1>
    <p>Votre espace financier personnel</p>
  </header>
  <main>
    <section class="card balance">
      <p>Solde disponible</p>
      <div class="amount">0,00 €</div>
      <p>Compte virtuel</p>
    </section>
    <section class="card">
      <h3>Mes opérations</h3>
      <div class="buttons">
        <button>Envoyer</button>
        <button>Recevoir</button>
        <button>Mes cartes</button>
        <button>Historique</button>
      </div>
    </section>
    <section class="card">
      <h3>Mon compte</h3>
      <p>Profil personnel</p>
      <p>Notifications</p>
      <p>Assistance</p>
    </section>
    <p class="notice">Prototype indépendant — soldes Réel. Affilié à BNP Paribas.</p>
  </main>
  <footer>Prototype BNP · Version initiale</footer>
</body>
</html>
